ors; Trump says Iran is looking at gas and bioweapons, but Washington need not be alarmed.</text><text x="20" y="855" font-size="11" fill="#555555">Key: CDC = US Centers for Disease Control and Prevention. NSA = National Security Agency. UKMTO = UK Maritime Trade Operations. AP = Associated Press. DC = Washington, District of Columbia.</text><text x="20" y="872" font-size="11" fill="#555555">Sources: Forbes, Yahoo Finance, AP via ABC News, ANI, The Week, CBS News, Al Jazeera, The Moscow Times, ABC News, CyberInsider, Bloomberg, Splash247, The National, CDC, USGS (United States Geological Survey).</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
