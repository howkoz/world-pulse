e="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="542.5" font-size="12.5" fill="#1A1A1A">Houthis claim hit on Ras Tanura refinery</text><rect x="957.7" y="531.0" width="116.1" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="948.7" y="542.0" font-size="11.5" fill="#444444" text-anchor="end">Saudi coalition downed four drones</text><rect x="20" y="563.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="573.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="574.5" font-size="12.5" fill="#1A1A1A">Iran claims 'complete control' of Hormuz</text><rect x="957.7" y="563.0" width="133.8" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="948.7" y="574.0" font-size="11.5" fill="#444444" text-anchor="end">US says main lanes are cleared</text><rect x="20" y="595.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="605.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="606.5" font-size="12.5" fill="#1A1A1A">Wall Street: Dow erases a 1,100-point drop</text><rect x="1042.3" y="595.0" width="38.4" height="14" rx="3" fill="#6A3FB5"/><text x="1088.6" y="606.0" font-size="11.5" fill="#444444">Dow +0.33%; Nvidia -3.9%</text><rect x="20" y="627.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="637.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="638.5" font-size="12.5" fill="#1A1A1A">Poland: NATO radar plane, shootdown debate</text><rect x="816.0" y="627.0" width="293.1" height="14" rx="3" fill="#6B6B6B" fill-opacity="0.18" stroke="#6B6B6B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="807.0" y="638.0" font-size="11