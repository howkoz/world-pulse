unday with oil near $90.</text><text x="20" y="835" font-size="11" fill="#555555">Key: FBI = Federal Bureau of Investigation. CIA = Central Intelligence Agency. FinCEN = Financial Crimes Enforcement Network. NATO = North Atlantic Treaty Organization. COP31 = the 31st United Nations climate conference.</text><text x="20" y="852" font-size="11" fill="#555555">OPEC+ = the oil producers' group and partners. UTC = Coordinated Universal Time. Sources: Reuters, AP, CNN, CBS, FOX Weather, Weather.com, Al Jazeera, WHO, Euromaidan Press, US News.</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
</svg>