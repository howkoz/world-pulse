<style id="theme-toggle-style">/* theme-toggle-v2 */
:root.dark { filter: invert(1) hue-rotate(180deg); background-color: #121212; }
.theme-toggle { cursor: pointer; }
.theme-toggle rect { fill: #ffffff; stroke: #94a3b8; }
.theme-toggle text { fill: #1e3a8a; font: 600 12px 'Segoe UI', Arial, sans-serif; }
.theme-toggle:hover rect { fill: #eef3ff; }
@media print { .theme-toggle { display: none; } }
</style><rect x="0" y="0" width="1100" height="780" fill="#FFFFFF"/><text x="20" y="36" font-size="22" font-weight="700" fill="#1A1A1A">Timeline: what happened in the world, 9 to 13 November 2026</text><text x="20" y="58" font-size="13" fill="#444444">One row per event. Bar length = how long it lasted. Dotted lines every 6 hours. Times are UTC (Coordinated Universal Time); US Eastern is UTC minus 5.</text><rect x="20" y="70" width="14" height="14" rx="3" fill="#1F6FB5"/><text x="40" y="82" font-size="12" fill="#333333">Tech and infrastructure</text><rect x="201.20000000000002" y="70" width="14" height="14" rx="3" fill="#B3261E"/><text x="221.20000000000002" y="82" font-size="12" fill="#333333">Iran and the military</text><rect x="369.6" y="70" width="14" height="14" rx="3" fill="#6B6B6B"/><text x="389.6" y="82" font-size="12" fill="#333333">Other wars and spying</text><rect x="538.0" y="70" width="14" height="14" rx="3" fill="#6A3FB5"/><text x="558.0" y="82" font-size="12" fill="#333333">Money and markets</text><rect x="680.8" y="70" width="14" height="14" rx="3" fill="#C77700"/><text x="700.8" y="82" font-size="12" fill="#333333">Health</text><rect x="20" y="92" width="26" height="12" rx="3" fill="#555555"/><text x="52" y="103" font-size="12" fill="#333333">Exact times published</text><rect x="200" y="92" width="26" height="12" rx="3" fill="#555555" fill-opacity="0.18" stroke="#555555" stroke-dasharray="4 3"/><text x="232" y="103" font-size="12" fill="#333333">Only the day or part of day is known</text><rect x="460" y="92" width="18" height="12" rx="3" fill="#555555"/><path d="M478 92 L488 98 L478 104 Z" fill="#555555"/><text x="494" y="103" font-size="12" fill="#333333">Still going when checked</text><rect x="650" y="92" width="26" height="12" rx="3" fill="#FFFFFF" stroke="#999999" stroke-width="1.4" stroke-dasharray="3 3"/><text x="682" y="103" font-size="12" fill="#333333">Claimed, not confirmed</text><rect x="760.7" y="128" width="300.5" height="532" fill="#FFF