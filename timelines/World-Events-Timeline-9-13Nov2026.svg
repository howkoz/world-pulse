="461.2" y="194.0" width="148.2" height="14" rx="3" fill="#6B6B6B" fill-opacity="0.18" stroke="#6B6B6B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="618.5" y="205.0" font-size="11.5" fill="#444444">date only (Tuesday); caught in a sting</text><text x="20" y="239.5" font-size="13" fill="#1A1A1A">Ebola in Congo: WHO update</text><rect x="610.5" y="228.0" width="450.7" height="14" rx="3" fill="#C77700" fill-opacity="0.18" stroke="#C77700" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M1061.2 226.0 L1070.2 235.0 L1061.2 244.0 Z" fill="#C77700"/><text x="602.5" y="239.0" font-size="11.5" fill="#444444" text-anchor="end">about 11,000 cases, 5,300+ deaths</text><text x="20" y="273.5" font-size="13" fill="#1A1A1A">Hormuz: 4 oil tankers hit by explosions</text><rect x="611.5" y="262.0" width="298.5" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="919.0" y="273.0" font-size="11.5" fill="#444444">Wed and Thu; oil near $94</text><text x="20" y="307.5" font-size="13" fill="#1A1A1A">Nvidia boss Jensen Huang resigns</text><rect x="761.7" y="296.0" width="148.2" height="14" rx="3" fill="#6A3FB5" fill-opacity="0.18" stroke="#6A3FB5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="752.7" y="307.0" font-size="11.5" fill="#444444" text-anchor="end">date only; shares fell up to 13%</text><text x="20" y="341.5" font-size="13" fill="#1A1A1A">Fedwire 'disruption' (unproven claim)</text><rect x="761.7" y="330.0" width="148.2" height="14" rx="3" fill="#FFFFFF" stroke="#999999" stroke-width="1.4" stroke-dasharray="3 3"/><text x="835.9" y="341.0" font-size="10.5" font-weight="700" fill="#C62828" text-anchor="middle">?</text><text x="919.0" y="341.0" font-size="11.5" fill="#444444">not confirmed anywhere</text><text x="20" y="375.5" font-size="13" fill="#1A1A1A">PayPal checkout down</text><rect x="810.8" y="364.0" width="4.0" height="14" rx="3" fill="#1F6FB5"/><text x="820.1" y="375.0" font-size="11.5" fill="#444444">08:00 to 08:12, 12 min</text><text x="20" y="409.5" font-size="13" fill="#1A1A1A">Microsoft 365 outage (Outlook, Teams)</text><rect x="862.6" y="398.0" width="159.9" height="14" rx="3" fill="#1F6FB5"/><rect x="1022.6" y="398.0" width="38.6" height="14" fill="#1F6FB5" fill-opacity="0.3"/><path d="M1061.2 396.0 L1070.2 405.0 L1061.2 414.0 Z" fill="#1F6FB5"/><text x="854.6" y="409.0" font-size="11.5" fill="#444444" text-anchor="end">16:17 to 17:50 next day (25.5 h), then recovering</text><text x="20" y="443.5" font-size="13" fill="#1A1A1A">Claude logins down (caused by Microsoft)</text><rect x="973.4" y="432.0" width="12.5" height="14" rx="3" fill="#1F6FB5"/><text x="965.4" y="443.0" font-size="11.5" fill="#444444" text-anchor="end">09:58 to 11:58, 2 h</text><text x="20" y="477.5" font-size="13" fill="#1A1A1A">Bahrain: 2 Iranian drones shot down</text><rect x="912.0" y="466.0" width="148.2" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="903.0" y="477.0" font-size="11.5" fill="#444444" text-anchor="end">date only; US says no damage</text><text x="20" y="511.5" font-size="13" fill="#1A1A1A">Ukraine blackouts; Moscow airports hit</text><rect x="912.0" y="500.0" width="148.2" height="14" rx="3" fill="#6B6B6B" fill-opacity="0.18" stroke="#6B6B6B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="903.0" y="511.0" font-size="11.5" fill="#444444" text-anchor="end">date only; strikes both ways</text><text x="20" y="545.5" font-size="13" fill="#1A1A1A">Bitcoin under $70,000; US stocks slide</text><rect x="912.0" y="534.0" width="148.2" height="14" rx="3" fill="#6A3FB5" fill-opacity="0.18" stroke="#6A3FB5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="903.0" y="545.0" font-size="11.5" fill="#444444" text-anchor="end">date only; hot inflation report</text><text x="20" y="579.5" font-size="13" fill="#1A1A1A">911 call problems (unverified)</text><rect x="912.0" y="568.0" width="148.2" height="14" rx="3" fill="#FFFFFF" stroke="#999999" stroke-width="1.4" stroke-dasharray="3 3"/><text x="986.1" y="579.0" font-size="10.5" font-weight="700" fill="#C62828" text-anchor="middle">?</text><text x="903.0" y="579.0" font-size="11.5" fill="#444444" text-anchor="end">298 user reports, one outlet</text><text x="20" y="613.5" font-size="13" fill="#1A1A1A">FAA halts every US departure</text><rect x="1017.4" y="602.0" width="43.8" height="14" rx="3" fill="#1F6FB5" fill-opacity="0.18" stroke="#1F6FB5" stroke-width="1.3" stroke-dasharray="4 3"/><path d="M1061.2 600.0 L1070.2 609.0 L1061.2 618.0 Z" fill="#1F6FB5"/><text x="1009.4" y="613.0" font-size="11.5" fill="#444444" text-anchor="end">afternoon US time; 1.5 million stranded</text><text x="20" y="647.5" font-size="13" fill="#1A1A1A">RAF Lakenheath: suspected drones</text><rect x="1018.4" y="636.0" width="35.6" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1009.4" y="647.0" font-size="11.5" fill="#444444" text-anchor="end">evening UK time; Iran link unproven</text><text x="20" y="720" font-size="12" font-weight="700" fill="#1A1A1A">Read it like this: the pile-up on the right is two separate stories. Blue is tech failing (Microsoft also knocked out Claude logins).</text><text x="20" y="738" font-size="12" font-weight="700" fill="#1A1A1A">Red is one Iran story building since Monday. Nothing found ties the red bars to the blue bars.</text><text x="20" y="760" font-size="11" fill="#555555">Key: FAA = Federal Aviation Administration. RAF = Royal Air Force. UTC = Coordinated Universal Time. WHO = World Health Organization. Fedwire = the Federal Reserve wire system.</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1022" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1055" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
</svg>