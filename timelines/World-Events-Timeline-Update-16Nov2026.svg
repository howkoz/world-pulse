802" font-size="12.5" font-weight="700" fill="#1A1A1A">Also: Israel killed Hamas's Rafah commander; NTSB points to a steering failure in New Orleans; the FT says Jensen Huang is weighing a return to Nvidia.</text><text x="20" y="823" font-size="11" fill="#555555">Key: FAA = Federal Aviation Administration. NTSB = National Transportation Safety Board. CDC = US Centers for Disease Control and Prevention. FT = Financial Times. NATO = North Atlantic Treaty Organization. US = United States.</text><text x="20" y="840" font-size="11" fill="#555555">Sources: Spaceflight Now, SpaceNews, Space.com, CNBC, Radio Free Europe, OilPrice, Al Jazeera, Al Arabiya, CNN, Gulf News, FAA, Reuters via US News, CDC, WLWT, NPR, Crypto Times, Cybersecurity News.</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
</svg>