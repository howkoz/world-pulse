<style id="theme-toggle-style">/* theme-toggle-v2 */
:root.dark { filter: invert(1) hue-rotate(180deg); background-color: #121212; }
.theme-toggle { cursor: pointer; }
.theme-toggle rect { fill: #ffffff; stroke: #94a3b8; }
.theme-toggle text { fill: #1e3a8a; font: 600 12px 'Segoe UI', Arial, sans-serif; }
.theme-toggle:hover rect { fill: #eef3ff; }
@media print { .theme-toggle { display: none; } }
</style>
