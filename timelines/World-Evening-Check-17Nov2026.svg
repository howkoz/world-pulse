<text x="52" y="204" font-size="11" font-weight="700" fill="#FFFFFF">RESULT</text>
<text x="120" y="204" font-size="12" fill="#555555">After the close, about 4:20 pm</text>
<text x="44" y="232" font-size="17" font-weight="700" fill="#1A1A1A">Nvidia beats forecasts in its first results without Jensen Huang</text>
<text x="44" y="256" font-size="13" fill="#2B2B2B">Revenue $115.8 billion for the quarter, up 103% on a year ago; analysts expected about $109 billion. Next quarter: about $130 billion, with no China data centre sales assumed.</text>
<text x="44" y="275" font-size="13" fill="#2B2B2B">Interim chief Colette Kress: "Our momentum is real." Board chair Harvey Jones: the board "does not intend to reinstate" Huang. A new committee will oversee export rules.</text>
<text x="44" y="294" font-size="13" fill="#2B2B2B">Shares closed at $155.46, then rose up to about 4% after hours (5% by the end of the call). Still about 35% below their record close.</text>
