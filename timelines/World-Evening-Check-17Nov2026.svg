<text x="944" y="354" font-size="12" fill="#555555">Market close</text>
<text x="860" y="382" font-size="17" font-weight="700" fill="#1A1A1A">Stocks fall a second day</text>
<text x="860" y="406" font-size="13" fill="#2B2B2B">Dow down 848.75 points (1.6%) to 50,759.42.</text>
<text x="860" y="425" font-size="13" fill="#2B2B2B">S&amp;P 500 down 1% to 7,340.53.</text>
<text x="860" y="444" font-size="13" fill="#2B2B2B">Nasdaq down 0.7% to 24,328.38.</text>
<text x="860" y="463" font-size="13" fill="#2B2B2B">Week so far: S&amp;P 500 down 2.9%, Dow down 3%.</text>
<text x="860" y="482" font-size="13" fill="#2B2B2B">All 11 sectors fell, led by software companies.</text>
