<text x="24" y="40" font-size="24" font-weight="700" fill="#1A1A1A">Evening check: what changed since the morning scan, Tuesday 17 November 2026</text>
<text x="24" y="64" font-size="13" fill="#4A4A4A">Checked about 7:45 pm Eastern. Each fact is from a major outlet; links are on World Pulse. The strip shows Tuesday hour by hour (Eastern).</text>
