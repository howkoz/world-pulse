dle">NEW</text><text x="86" y="638.5" font-size="12.5" fill="#1A1A1A">Ukraine launches one of its biggest raids on Moscow</text><rect x="1105.2" y="627.0" width="39.3" height="14" rx="3" fill="#6B6B6B" fill-opacity="0.18" stroke="#6B6B6B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1096.2" y="638.0" font-size="11.5" fill="#444444" text-anchor="end">462 drones claimed; airports shut</text><text x="20" y="712" font-size="12.5" font-weight="700" fill="#1A1A1A">What changed: Ukraine launched one of its largest drone raids yet on Moscow overnight; the mayor reported about 462 drones and shut the capital's airports.</text><text x="20" y="731" font-size="12.5" font-weight="700" fill="#1A1A1A">The US disabled a ship running Iran's port blockade, and a Russian convoy bound for Libya turned back after a warship was sunk.</text><text x="20" y="750" font-size="12.5" font-weight="700" fill="#1A1A1A">New since yesterday: a United Kingdom bank outage at Lloyds and Bank of Scotland, and Wall Street closed its best week since 2022.</text><text x="20" y="771" font-size="11" fill="#555555">Key: WHO = World Health Organization. CENTCOM = United States Central Command. FCC = Federal Communications Commission. FinCEN = Financial Crimes Enforcement Network.</text><text x="20" y="788" font-size="11" fill="#555555">UK = United Kingdom. US = United States. S&amp;P = Standard and Poor's 500 share index. UTC = Coordinated Universal Time. Sources: Kyiv Independent, Kyiv Post, Euronews, Reuters via TimesLIVE, WHO, Bitcoin.com, Washington Times, Finextra, USGS.</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
