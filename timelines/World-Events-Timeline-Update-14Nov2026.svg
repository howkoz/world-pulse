t-anchor="middle">NEW</text><text x="86" y="414.5" font-size="12.5" fill="#1A1A1A">Washington DC: gym shooting</text><rect x="892.7" y="403.0" width="21.6" height="14" rx="3" fill="#00796B" fill-opacity="0.18" stroke="#00796B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="923.3" y="414.0" font-size="11.5" fill="#444444">Thursday morning; 1 killed, 4 to 6 hurt</text><rect x="20" y="435.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="445.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="446.5" font-size="12.5" fill="#1A1A1A">Microsoft 365 outage (Outlook, Teams)</text><rect x="911.1" y="435.0" width="150.8" height="14" rx="3" fill="#1F6FB5"/><rect x="1061.9" y="435.0" width="108.5" height="14" fill="#1F6FB5" fill-opacity="0.25"/><text x="903.1" y="446.0" font-size="11.5" fill="#444444" text-anchor="end">recovered; still no root cause published</text><rect x="20" y="467.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="477.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="478.5" font-size="12.5" fill="#1A1A1A">Ukraine drones shut all 4 Moscow airports</text><rect x="928.2" y="467.0" width="51.1" height="14" rx="3" fill="#6B6B6B" fill-opacity="0.18" stroke="#6B6B6B" stroke-width="1.3" stroke-dasharray="4 3"/><text x="988.3" y="478.0" font-size="11.5" fill="#444444">overnight; Russia claims 100+ drones downed</text><text x="86" y="510.5" font-size="12.5" fill="#1A1A1A">Claude logins down (caused by Microsoft)</text><rect x="1015.5" y="499.0" width="11.8" height="14" rx="3" fill="#1F6FB5"/><text x="1035.3" y="510.0" font-size="11.5" fill="#444444">2 hours</text><rect x="20" y="531.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="541.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="542.5" font-size="12.5" fill="#1A1A1A">Bahrain: 2 Iranian drones shot down</text><rect x="957.7" y="531.0" width="139.7" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="948.7" y="542.0" font-size="11.5" fill="#444444" text-anchor="end">Iran calls it payback; no US strike back found</text><rect x="20" y="563.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="573.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="574.5" font-size="12.5" fill="#1A1A1A">Bitcoin near $68,000; US stocks slide</text><rect x="957.7" y="563.0" width="139.7" height="14" rx="3" fill="#6A3FB5" fill-opacity="0.18" stroke="#6A3FB5" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1106.3" y="574.0" font-size="11.5" fill="#444444">lowest since August</text><text x="86" y="606.5" font-size="12.5" fill="#1A1A1A">911 call problems (unverified)</text><rect x="957.7" y="595.0" width="139.7" height="14" rx="3" fill="#FFFFFF" stroke="#999999" stroke-width="1.4" stroke-dasharray="3 3"/><text x="1027.5" y="606.0" font-size="10.5" font-weight="700" fill="#C62828" text-anchor="middle">?</text><text x="1106.3" y="606.0" font-size="11.5" fill="#444444">still one outlet only</text><rect x="20" y="627.0" width="29.799999999999997" height="14" rx="7" fill="#2E7D32"/><text x="34.9" y="637.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">NEW</text><text x="86" y="638.5" font-size="12.5" fill="#1A1A1A">New Orleans: tanker hits river cruise ship</text><rect x="1065.9" y="627.0" width="4.0" height="14" rx="3" fill="#00796B"/><text x="1057.9" y="638.0" font-size="11.5" fill="#444444" text-anchor="end">32 to hospital, none critical</text><rect x="20" y="659.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="669.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="670.5" font-size="12.5" fill="#1A1A1A">RAF Lakenheath: suspected drones</text><rect x="1058.0" y="659.0" width="33.4" height="14" rx="3" fill="#B3261E" fill-opacity="0.18" stroke="#B3261E" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1049.0" y="670.0" font-size="11.5" fill="#444444" text-anchor="end">over, no damage; Iran or Russia link unproven</text><rect x="20" y="691.0" width="56.199999999999996" height="14" rx="7" fill="#1F6FB5"/><text x="48.099999999999994" y="701.5" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">UPDATED</text><text x="86" y="702.5" font-size="12.5" fill="#1A1A1A">FAA halts every US departure</text><rect x="1080.0" y="691.0" width="25.7" height="14" rx="3" fill="#1F6FB5"/><text x="1072.0" y="702.0" font-size="11.5" fill="#444444" text-anchor="end">4 h 20 min; 15,000+ flights hit; cause disputed</text><text x="20" y="776" font-size="12.5" font-weight="700" fill="#1A1A1A">What changed: the FAA stop ended after about 4 hours 20 minutes, but officials still disagree on why (overloaded routers or a system update).</text><text x="20" y="795" font-size="12.5" font-weight="700" fill="#1A1A1A">Microsoft still owes a root cause. Lakenheath is over, with no proven link to Iran or Russia. Two new stories: New Orleans river crash, DC gym shooting.</text><text x="20" y="814" font-size="12.5" font-weight="700" fill="#1A1A1A">Coming next week: the APEC summit in Shenzhen, China, where Trump, Putin and Xi may meet. The Iran war and Hormuz are on the agenda.</text><text x="20" y="835" font-size="11" fill="#555555">Key: FAA = Federal Aviation Administration. RAF = Royal Air Force. DC = District of Columbia. WHO = World Health Organization. Fedwire = the Federal Reserve wire system.</text><text x="20" y="852" font-size="11" fill="#555555">APEC = Asia-Pacific Economic Cooperation. UTC = Coordinated Universal Time. Sources: CNN, Wikipedia, Reuters via Euronext, Al Jazeera, CENTCOM (US Central Command), WHO, CBS, NBC.</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
</svg>