ants an inquiry.</text><text x="20" y="815" font-size="12.5" font-weight="700" fill="#1A1A1A">COP31 climate talks collapsed with no deal. Trump says ships that run the US blockade of Iran will be sunk. Iran's F-16 claim is denied.</text><text x="20" y="834" font-size="12.5" font-weight="700" fill="#1A1A1A">Ariane 6 with 36 Amazon satellites was called off (ground system). Futures and bitcoin bounced. A funeral boat capsized in Nigeria: 24 dead.</text><text x="20" y="855" font-size="11" fill="#555555">Key: UN = United Nations. COP31 = 31st United Nations climate Conference of the Parties. CENTCOM = US Central Command. WHO = World Health Organization.</text><text x="20" y="872" font-size="11" fill="#555555">Times on the axis are UTC. Eastern (US) = UTC minus 5. Rows with no tag have not changed since the last check.</text><text x="20" y="889" font-size="11" fill="#555555">Sources: CNBC, ABC News, Al Jazeera, Reuters, UN News, CBS News, CBC, Space.com, PBS (AP, Associated Press), JNS, Euronews, The Moscow Times,</text><text x="20" y="906" font-size="11" fill="#555555">CoinDesk, Benzinga, Nature, US News, NWS (National Weather Service), USGS (United States Geological Survey).</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
