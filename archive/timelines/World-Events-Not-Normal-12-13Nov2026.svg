<svg width="100%" height="100%" data-fixed-size="1200 960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="Arial, Helvetica, sans-serif">
<style id="theme-toggle-style">/* theme-toggle-v2 */
:root.dark { filter: invert(1) hue-rotate(180deg); background-color: #121212; }
.theme-toggle { cursor: pointer; }
.theme-toggle rect { fill: #ffffff; stroke: #94a3b8; }
.theme-toggle text { fill: #1e3a8a; font: 600 12px 'Segoe UI', Arial, sans-serif; }
.theme-toggle:hover rect { fill: #eef3ff; }
@media print { .theme-toggle { display: none; } }
</style><rect x="0" y="0" width="1200" height="960" fill="#FFFFFF"/><text x="25" y="38" font-size="22" font-weight="700" fill="#1A1A1A">What is not normal: 12 to 13 November 2026</text><text x="25" y="60" font-size="13" fill="#444444">Every claim from the pasted summary, checked against live news on the evening of 13 Nov (US time), plus what it missed.</text><rect x="25" y="72" width="14" height="14" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><text x="45" y="84" font-size="12" fill="#333333">Confirmed</text><rect x="114.4" y="72" width="14" height="14" rx="3" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><text x="134.4" y="84" font-size="12" fill="#333333">Confirmed, but cause or link still open</text><rect x="401.79999999999995" y="72" width="14" height="14" rx="3" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/><text x="421.79999999999995" y="84" font-size="12" fill="#333333">Could not confirm</text><rect x="544.0" y="72" width="14" height="14" rx="3" fill="#F2F2F2" stroke="#666666" stroke-width="1.6"/><text x="564.0" y="84" font-size="12" fill="#333333">Checked, separate or nothing found</text><text x="25" y="118" font-size="14" font-weight="700" fill="#1F4E79" letter-spacing="1">TECHNOLOGY FAILURES</text><text x="410" y="118" font-size="14" font-weight="700" fill="#8B1E1E" letter-spacing="1">IRAN AND THE MILITARY</text><text x="800" y="118" font-size="14" font-weight="700" fill="#3D3D3D" letter-spacing="1">OTHER BIG STORIES</text><rect x="25" y="130" width="350" height="120" rx="8" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><rect x="291.0" y="136" width="78.0" height="16" rx="8" fill="#C77700"/><text x="330.0" y="148" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CAUSE OPEN</text><text x="37" y="168" font-size="13" font-weight="700" fill="#1A1A1A">Microsoft 365 outage (12 Nov, 16:17 UTC)</text><text x="37" y="186" font-size="12" fill="#333333">Outlook, Teams calendar, Copilot, 74+ countries</text><text x="37" y="202" font-size="12" fill="#333333">Microsoft: secure-connection process overloaded</text><text x="37" y="218" font-size="12" fill="#333333">Microsoft: no sign of an attack</text><text x="37" y="234" font-size="12" fill="#333333">13 Nov: broad recovery; full root cause still owed</text><rect x="25" y="278" width="350" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="297.6" y="284" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="333.3" y="296" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="37" y="316" font-size="13" font-weight="700" fill="#1A1A1A">Claude logins down (13 Nov, 2 hours)</text><text x="37" y="334" font-size="12" fill="#333333">Anthropic: caused by the Microsoft 365 incident</text><rect x="25" y="360" width="350" height="62" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="297.6" y="366" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="333.3" y="378" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="37" y="398" font-size="13" font-weight="700" fill="#1A1A1A">PayPal checkout down (12 Nov)</text><text x="37" y="416" font-size="12" fill="#333333">08:00 to 08:12 UTC, 12 minutes, now fixed</text><rect x="25" y="448" width="350" height="118" rx="8" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><rect x="291.0" y="454" width="78.0" height="16" rx="8" fill="#C77700"/><text x="330.0" y="466" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CAUSE OPEN</text><text x="37" y="486" font-size="13" font-weight="700" fill="#1A1A1A">FAA halts every US departure (13 Nov)</text><text x="37" y="504" font-size="12" fill="#333333">Comms failure hit all en-route control centers</text><text x="37" y="520" font-size="12" fill="#333333">About 3,100 planes in the air; 1.5 million stranded</text><text x="37" y="536" font-size="12" fill="#333333">Official cause: telecom outage. One airline: routers</text><text x="37" y="552" font-size="12" fill="#333333">DHS: no sign of attack, not tied to Microsoft</text><rect x="25" y="586" width="350" height="86" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="297.6" y="592" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="333.3" y="604" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="37" y="624" font-size="13" font-weight="700" fill="#1A1A1A">GitHub (13 Nov)</text><text x="37" y="642" font-size="12" fill="#333333">Pull request merges timing out, 3% then under 1%</text><text x="37" y="658" font-size="12" fill="#333333">Copilot models degraded 19:05 to 21:27 UTC</text><rect x="25" y="692" width="350" height="86" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="1.6"/><rect x="271.2" y="698" width="97.8" height="16" rx="8" fill="#C62828"/><text x="320.1" y="710" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">NOT CONFIRMED</text><text x="37" y="730" font-size="13" font-weight="700" fill="#1A1A1A">Federal Reserve Fedwire 'disruption' (12 Nov)</text><text x="37" y="748" font-size="12" fill="#333333">No news report found; Fed shows normal operations</text><text x="37" y="764" font-size="12" fill="#333333">Only a third-party tracker claims it. Unproven.</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><line x1="200" y1="250" x2="200" y2="275" stroke="#1F4E79" stroke-width="2.2" marker-end="url(#ah)"/><text x="208" y="267" font-size="11" font-weight="700" fill="#1F4E79">caused</text><text x="0" y="0" font-size="11" font-weight="700" fill="#888888" transform="translate(16,560) rotate(-90)">not linked</text><line x1="20" y1="250" x2="20" y2="448" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="410" y="130" width="350" height="86" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="682.6" y="136" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="718.3" y="148" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="422" y="168" font-size="13" font-weight="700" fill="#1A1A1A">9 Nov: US pulls aircraft out of RAF Mildenhall</text><text x="422" y="186" font-size="12" fill="#333333">9 to 13 tankers and Ospreys; reported Iran threat</text><text x="422" y="202" font-size="12" fill="#333333">Bases raised to Force Protection Charlie</text><rect x="410" y="236" width="350" height="86" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="682.6" y="242" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="718.3" y="254" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="422" y="274" font-size="13" font-weight="700" fill="#1A1A1A">11 to 12 Nov: 4 oil tankers hit in Hormuz</text><text x="422" y="292" font-size="12" fill="#333333">Explosions in the Strait of Hormuz</text><text x="422" y="308" font-size="12" fill="#333333">Brent crude near $94 a barrel</text><rect x="410" y="342" width="350" height="118" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="682.6" y="348" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="718.3" y="360" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="422" y="380" font-size="13" font-weight="700" fill="#1A1A1A">13 Nov: US downs 2 Iranian drones at Bahrain</text><text x="422" y="398" font-size="12" fill="#333333">CENTCOM: aimed at Bahrain, US Fifth Fleet home</text><text x="422" y="414" font-size="12" fill="#333333">IRGC claims a US radar destroyed; US denies</text><text x="422" y="430" font-size="12" fill="#333333">First Iranian shot at a Gulf base in 2 months</text><text x="422" y="446" font-size="12" fill="#333333">Trump: holding off new strikes, allies asked</text><rect x="410" y="480" width="350" height="102" rx="8" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><rect x="656.2" y="486" width="97.8" height="16" rx="8" fill="#C77700"/><text x="705.1" y="498" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">LINK UNPROVEN</text><text x="422" y="518" font-size="13" font-weight="700" fill="#1A1A1A">13 Nov evening: drones over RAF Lakenheath</text><text x="422" y="536" font-size="12" fill="#333333">Base sheltered in place; resolved, no damage</text><text x="422" y="552" font-size="12" fill="#333333">Same area as the Mildenhall threat</text><text x="422" y="568" font-size="12" fill="#333333">Link to Iran NOT proven (Sky News)</text><rect x="410" y="602" width="350" height="102" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="1.6"/><rect x="689.2" y="608" width="64.8" height="16" rx="8" fill="#666666"/><text x="721.6" y="620" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">SEPARATE</text><text x="422" y="640" font-size="13" font-weight="700" fill="#1A1A1A">10 Nov: US Army officer held in UK</text><text x="422" y="658" font-size="12" fill="#333333">Lieutenant colonel at a NATO corps; UK sting</text><text x="422" y="674" font-size="12" fill="#333333">Suspected of trying to spy for Russia</text><text x="422" y="690" font-size="12" fill="#333333">Officials: separate from the Iran threats</text><path d="M768 130 H776 V582 H768" fill="none" stroke="#8B1E1E" stroke-width="2.2"/><text x="0" y="0" font-size="11" font-weight="700" fill="#8B1E1E" letter-spacing="1" transform="translate(791,440) rotate(-90)">ONE IRAN THREAD</text><rect x="800" y="130" width="375" height="102" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="1097.6" y="136" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="1133.3" y="148" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="812" y="168" font-size="13" font-weight="700" fill="#1A1A1A">12 Nov: Nvidia CEO Jensen Huang resigns</text><text x="812" y="186" font-size="12" fill="#333333">Effective immediately (company filing with SEC)</text><text x="812" y="202" font-size="12" fill="#333333">Interim CEO: finance chief Colette Kress</text><text x="812" y="218" font-size="12" fill="#333333">Shares fell as much as 13%, then bounced</text><rect x="800" y="252" width="375" height="86" rx="8" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><rect x="1091.0" y="258" width="78.0" height="16" rx="8" fill="#C77700"/><text x="1130.0" y="270" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CAUSE OPEN</text><text x="812" y="290" font-size="13" font-weight="700" fill="#1A1A1A">Ebola in Congo: still spreading</text><text x="812" y="308" font-size="12" fill="#333333">About 11,000 cases, 5,300+ deaths (WHO, 11 Nov)</text><text x="812" y="324" font-size="12" fill="#333333">Cases also in Uganda, Kenya, Nigeria, France</text><rect x="800" y="358" width="375" height="86" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/><rect x="1097.6" y="364" width="71.4" height="16" rx="8" fill="#2E7D32"/><text x="1133.3" y="376" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CONFIRMED</text><text x="812" y="396" font-size="13" font-weight="700" fill="#1A1A1A">Bitcoin under $70,000; stocks slide (13 Nov)</text><text x="812" y="414" font-size="12" fill="#333333">Hot inflation report; $1.3 billion in bets wiped out</text><text x="812" y="430" font-size="12" fill="#333333">Lowest Bitcoin since August</text><rect x="800" y="464" width="375" height="86" rx="8" fill="#F2F2F2" stroke="#666666" stroke-width="1.6"/><rect x="1110.8" y="470" width="58.199999999999996" height="16" rx="8" fill="#666666"/><text x="1139.9" y="482" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CHECKED</text><text x="812" y="502" font-size="13" font-weight="700" fill="#1A1A1A">No big storm, quake or cyberattack found</text><text x="812" y="520" font-size="12" fill="#333333">No major disaster dated 12 to 13 Nov</text><text x="812" y="536" font-size="12" fill="#333333">One unverified ransomware leak claim only</text><rect x="25" y="800" width="1150" height="104" rx="8" fill="#F3F6FA" stroke="#1F4E79" stroke-width="1.6"/><text x="40" y="824" font-size="14" font-weight="700" fill="#1F4E79">VERDICT</text><text x="40" y="846" font-size="13" fill="#1A1A1A">1. One real chain: the Microsoft outage also knocked out Claude logins for 2 hours. The other tech failures had their own causes.</text><text x="40" y="865" font-size="13" fill="#1A1A1A">2. One real pattern: Iran is pressing on US bases (Britain and the Gulf) and on shipping. The Lakenheath drones are not yet tied to it.</text><text x="40" y="884" font-size="13" fill="#1A1A1A">3. Nothing ties the FAA, Microsoft and military events together. The FAA root cause is still open: only one airline source says routers.</text><text x="25" y="928" font-size="11" fill="#555555">Key: FAA = Federal Aviation Administration. DHS = Department of Homeland Security. CENTCOM = US Central Command. IRGC = Iran's Revolutionary Guard Corps.</text><text x="25" y="944" font-size="11" fill="#555555">NATO = North Atlantic Treaty Organization. CEO = chief executive officer. SEC = Securities and Exchange Commission. UTC = Coordinated Universal Time. WHO = World Health Organization.</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1122" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1155" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
</svg>