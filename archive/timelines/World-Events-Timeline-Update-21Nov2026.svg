anged: the Nasdaq fell 5.28% on Friday and lost its 2026 gains; Nvidia fell 13.8% after Reuters reported an SEC accounting inquiry.</text><text x="20" y="815" font-size="12.5" font-weight="700" fill="#1A1A1A">The S&amp;P 500 and the Dow closed in a correction (10% below their records); bitcoin fell to about $55,600, its lowest since September 2024.</text><text x="20" y="834" font-size="12.5" font-weight="700" fill="#1A1A1A">New: Russian weapons came down in Poland during a big attack on Kyiv; Denmark expels a Russian attache; deep quakes in Peru and off Timor-Leste.</text><text x="20" y="855" font-size="11" fill="#555555">Key: CDC = US Centers for Disease Control and Prevention. NSA = National Security Agency. SEC = Securities and Exchange Commission.</text><text x="20" y="872" font-size="11" fill="#555555">NATO = North Atlantic Treaty Organization. UKMTO = UK Maritime Trade Operations. S&amp;P = Standard and Poor's. CNN = Cable News Network.</text><text x="20" y="889" font-size="11" fill="#555555">Sources: Reuters via Bloomberg, NBC News, UPI, Yahoo Finance, AP via ABC News and US News, PBS, Al Jazeera, Kyiv Independent, CNN, Gulf News, Business Recorder, Deccan Herald, CDC, USGS (United States Geological Survey).</text><g class="theme-toggle" id="theme-toggle" role="button" aria-label="Switch between light and dark"><rect x="1182" y="10" width="66" height="26" rx="7" stroke-width="1"/><text id="theme-toggle-label" x="1215" y="27" text-anchor="middle">Dark</text></g>
<script id="theme-toggle-script"><![CDATA[
(function () {
  var root = document.documentElement, key = 'theme:' + location.pathname;
  var label = document.getElementById('theme-toggle-label');
  function set(dark) {
    if (dark) { root.classList.add('dark'); } else { root.classList.remove('dark'); }
    if (label) { label.textContent = dark ? 'Light' : 'Dark'; }
  }
  try { set(localStorage.getItem(key) === 'dark'); } catch (e) { set(false); }
  var btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      set(dark);
      try { localStorage.setItem(key, dark ? 'dark' : 'light'); } catch (e) {}
    });
  }
})();
]]></script>
